name: Season leaders race (data)

# Saturday 05:00 Athens: the season leaders race's data for the latest finished round (scripts/race.py pick ->
# races/<season>/round-NN/race.json, about 50 EuroLeague API calls, a second apart). Saturday early is when nothing else
# of ours calls the API (the round map from 07:30, the Saturday routine 08:07, next-game from 09:00, final scores only
# on game days), so a rate limit here can't hold up another post; on a day with a game it does nothing. The Saturday
# routine then writes the words (Greek names, title, captions) and queues the Reel for 15:00 without approval
# (ROUTINE.md; the owner's decision, 2026-11-23). Two runs, because
# GitHub sometimes skips scheduled runs; the second finds the data there and stops.
on:
  schedule:
    - cron: "0 3,4 * * 6"
  # The routines start this job on time by pushing kick/race (GitHub's clock above often runs late or not at
  # all; it stays as a backup, and a second start finds the work done).
  push:
    branches: [main]
    paths: ["kick/race"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: race
  cancel-in-progress: false

jobs:
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the race data
        run: |
          git config user.name "parquet-hoops-bot"
          git config user.email "parquet-hoops-bot@users.noreply.github.com"
          python3 scripts/race.py pick
          git add races 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -q -m "Season leaders race data"
            git pull -q --rebase origin main
            git push -q origin main
          fi
