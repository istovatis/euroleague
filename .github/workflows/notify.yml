name: Notify drafts

# When the drafting routines push new drafts to publish/queue.json, open an issue that @mentions the owner, so GitHub
# emails it with the previews and how to approve (reply "approve"). See scripts/notify_drafts.py.
on:
  push:
    branches: [main]
    paths: ["publish/queue.json"]
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test email with mock drafts (approves nothing)"
        type: boolean
        default: false

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: approve
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Announce new drafts
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO_APPROVE_DAY_POSTS: ${{ vars.AUTO_APPROVE_DAY_POSTS }}
        run: |
          git config user.name "parquet-hoops-bot"
          git config user.email "parquet-hoops-bot@users.noreply.github.com"
          if [ "${{ inputs.test }}" = "true" ]; then python3 scripts/notify_drafts.py notify --test; exit 0; fi
          python3 scripts/notify_drafts.py notify | tee /tmp/notify.log
          # Posts queued already approved (the MVP Reels, the Lineup, the next-game posts): start the publisher now rather
          # than trusting GitHub's 15-minute timer, which often skips runs. A run waits up to ~5 hours for a scheduled post.
          if python3 -c "
          import datetime as dt, sys
          sys.path.insert(0, 'scripts'); import publish_queue as q
          now = dt.datetime.now(dt.timezone.utc)
          soon = [e for e in q.load() if e.get('approved', True) and dt.datetime.fromisoformat(e['when']) < now + dt.timedelta(hours=24)
                  and not all(q.done(e, l) for l in e['langs'] if l != 'x')]
          sys.exit(0 if soon else 1)"; then
            gh workflow run publish.yml -f dry_run=false
          fi
          git add publish/queue.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Queue: drafts announced"
          git pull -q --rebase origin main
          git push -q origin main
          if grep -q "^AUTO-APPROVED" /tmp/notify.log; then gh workflow run publish.yml -f dry_run=false; fi
