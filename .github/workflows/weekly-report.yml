name: Weekly report

# Every Monday: last week's Instagram and X numbers -> reports/weekly/<date>.md and reports/latest.md,
# plus a GitHub issue with the report so the owner gets a notification (last week's issue is closed).
on:
  schedule:
    - cron: "0 7 * * 1"  # Monday 07:00 UTC (10:00 Athens)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: weekly-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the report
        env:
          IG_TOKEN_EN: ${{ secrets.IG_TOKEN_EN }}
          IG_TOKEN_EL: ${{ secrets.IG_TOKEN_EL }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          X_ENABLED: ${{ vars.X_ENABLED }}
        run: python3 scripts/weekly_report.py
      - name: Commit and open the issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "parquet-hoops-bot"
          git config user.email "parquet-hoops-bot@users.noreply.github.com"
          git add reports/
          git commit -q -m "Weekly report $(date -u +%F)"
          git pull -q --rebase origin main
          git push -q origin main
          for n in $(gh issue list --state open --search "Weekly report in:title" --json number -q '.[].number'); do
            gh issue close "$n" --comment "Superseded by the new weekly report."
          done
          gh issue create --title "Weekly report $(date -u +%F)" --assignee "${{ github.repository_owner }}" --body-file reports/latest.md
