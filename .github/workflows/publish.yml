name: Publish to Instagram

# Publishes every due entry in publish/queue.json (see scripts/publish_queue.py).
# Tokens live in the repository secrets IG_TOKEN_EN, IG_TOKEN_EL and X_*; they never appear in logs or code.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: check tokens and posts, publish nothing"
        type: boolean
        default: true
      x_upload_test:
        description: "Test an X media upload: story folder; uploads its X image or video, posts nothing"
        required: false
      reel_story:
        description: "Preview a Reel: story folder to render (EN + EL); the videos are attached to the run, nothing is posted"
        required: false

permissions:
  actions: write
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==10.4.0
      - name: Configure git
        run: |
          git config user.name "parquet-hoops-bot"
          git config user.email "parquet-hoops-bot@users.noreply.github.com"
      - name: Publish due posts
        env:
          IG_TOKEN_EN: ${{ secrets.IG_TOKEN_EN }}
          IG_TOKEN_EL: ${{ secrets.IG_TOKEN_EL }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          X_ENABLED: ${{ vars.X_ENABLED }}
          REEL_STORY: ${{ inputs.reel_story }}
          X_UPLOAD_TEST: ${{ inputs.x_upload_test }}
          GH_TOKEN: ${{ github.token }}  # Reel videos are staged as assets of the "reels" release
        run: |
          if [ -n "$X_UPLOAD_TEST" ]; then
            python3 scripts/publish_x.py "$X_UPLOAD_TEST" --upload-only
          elif [ -n "$REEL_STORY" ]; then
            python3 scripts/publish_instagram.py "$REEL_STORY" en --reel
            python3 scripts/publish_instagram.py "$REEL_STORY" el --reel
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 scripts/publish_queue.py check
            python3 scripts/publish_queue.py run --dry-run
          else
            python3 scripts/publish_queue.py run --drain || status=$?
            # Approved posts still scheduled within 24 hours: start the next run now rather than trusting GitHub's
            # timer (it skips runs). Each run waits up to ~5 hours for scheduled posts, so this chains until they're out.
            if python3 -c "
          import datetime as dt, json, sys
          sys.path.insert(0, 'scripts'); import publish_queue as q
          now = dt.datetime.now(dt.timezone.utc)
          soon = [e for e in q.load() if e.get('approved', True) and now < dt.datetime.fromisoformat(e['when']) < now + dt.timedelta(hours=24)
                  and not all(q.done(e, l) for l in e['langs'] if l != 'x')]
          sys.exit(0 if soon else 1)"; then
              gh workflow run publish.yml -f dry_run=false
            fi
            exit ${status:-0}
          fi
      - name: Keep the Reel previews
        if: inputs.reel_story != ''
        uses: actions/upload-artifact@v4
        with:
          name: reels
          path: ${{ inputs.reel_story }}/cards/*/reel.mp4
